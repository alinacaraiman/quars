[general]
data_source = "api" # "api" fetches from [data_api], "csv" reads data_file
data_file = "data/historical_data.csv"

[portofolio_optimization]
method = "MVO"
sub_method = "near-optimal"
risk_free_rate = 0.01 # annualized
params = [6, 0.95]

[data_api]
source = "yahoo" # needs no API key
tickers = ["AAPL", "GOOGL", "IBM", "JNJ", "XOM", "TLT"]
start_date = "2020-01-01"
end_date = "2024-12-31"
timeframe = "daily"
